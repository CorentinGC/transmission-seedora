name: CodeQL

on:
  pull_request:
    branches:
      - staging
      - main
  push:
    branches:
      - staging
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    # Skipped for fork PRs: the repository is public and the runner is self-hosted
    # (seedora-transmission-3o1). Scheduled and push runs are unaffected.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 30
    permissions:
      contents: read
      # Required to upload the SARIF results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
