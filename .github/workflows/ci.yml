name: CI

on:
  pull_request:
  push:
    branches:
      - staging

# PR workflows never need a write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job runs on the self-hosted Linux runner `helmut` (project decision: no GitHub-hosted
# runners for CI). The repository is public, so jobs are skipped for pull requests from forks:
# their code must never execute on the runner (see beads seedora-transmission-3o1).
#
# Jobs marked `continue-on-error` are red on the baseline. They are NOT hidden: the failure shows
# in the run. Each one references the issue that removes the flag when it is fixed.
jobs:
  lint:
    name: Lint
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run lint

  format:
    name: Format check
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 10
    # Red on baseline: the repo-wide format commit has not landed (seedora-transmission-00q).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run format:check

  typecheck:
    name: Typecheck
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  test:
    name: Unit tests
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm test

  i18n:
    name: i18n parity
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 10
    # Red on baseline: 21 locales miss 49 keys (seedora-transmission-k5r.1). Remove this flag
    # when that lands; seedora-transmission-we5.5 stays open until then.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run i18n:check

  build-web:
    name: Build web app
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run build:web

  package:
    name: Package Electron (Linux smoke)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, helmut]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: npm run package
